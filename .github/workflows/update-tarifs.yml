name: Mise à jour annuelle des tarifs énergie

on:
  schedule:
    # Une fois par an, le 15 février à 7 h (heure de Paris) :
    # après la révision des tarifs réglementés du 1er février,
    # le temps que les fournisseurs alternatifs et les comparateurs s'alignent.
    - cron: '0 6 15 2 *'
  workflow_dispatch:   # lancement manuel possible à tout moment

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Cloner le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer les dépendances
        run: pip install anthropic

      - name: Mettre à jour les tarifs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python update_tarifs.py

      - name: Committer les changements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet tarifs.json; then
            echo "Aucun changement de tarifs."
          else
            git add tarifs.json
            git commit -m "Mise à jour annuelle des tarifs énergie"
            git push
            echo "tarifs.json mis à jour."
          fi
