name: Mise à jour des tarifs énergie

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Cloner le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer les dépendances
        run: pip install anthropic

      - name: Mettre à jour les tarifs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python update_tarifs.py

      - name: Committer les changements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet tarifs.json; then
            echo "Aucun changement de tarifs."
          else
            git add tarifs.json
            git commit -m "Mise à jour automatique des tarifs energie"
            git push
            echo "tarifs.json mis à jour."
          fi
